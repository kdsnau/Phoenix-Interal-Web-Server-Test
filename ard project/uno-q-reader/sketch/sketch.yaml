profiles:
  default:
    fqbn: arduino:zephyr:unoq
    platforms:
      - platform: arduino:zephyr
    libraries:
      # Every library needs an explicit (version) or App Lab rejects the sketch.yaml.
      # Arduino_RouterBridge itself ships with the core, so it is NOT listed here —
      # only its dependencies are.
      - Adafruit PN532 (1.3.4)
      - Adafruit BusIO (1.17.4)
      - MsgPack (0.4.2)
      - DebugLog (0.8.4)
      - ArxContainer (0.7.0)
      - ArxTypeTraits (0.3.1)
default_profile: default
